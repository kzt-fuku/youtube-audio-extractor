<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2483d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OtoClip">
<title>OtoClip</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <img src="/static/icon.svg" alt="" width="36" height="36">
    <h1>OtoClip</h1>
    <span class="ver" id="ver"></span>
  </header>

  <section class="card">
    <form id="form" autocomplete="off">
      <label class="lbl" for="url">YouTube のリンク</label>
      <div class="row">
        <input id="url" type="url" inputmode="url" placeholder="https://youtu.be/…" required>
        <button type="button" id="paste" class="ghost" title="クリップボードから貼り付け">貼り付け</button>
      </div>
      <div class="opts">
        <label>音質
          <select id="quality">
            <option value="128">128 kbps（軽い）</option>
            <option value="192" selected>192 kbps（標準）</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps（高音質）</option>
          </select>
        </label>
        <label class="chk"><input type="checkbox" id="playlist"> プレイリストごと（最大50曲）</label>
      </div>
      <button type="submit" class="primary" id="go">MP3 を取得</button>
      <p class="hint">リンクを貼り付けたら Enter キーか「MP3 を取得」で開始します。</p>
      <p class="err" id="err" hidden></p>
    </form>
  </section>

  <section id="jobsSec" hidden>
    <h2>処理中・完了</h2>
    <ul id="jobs" class="list"></ul>
  </section>

  <section>
    <div class="sechead">
      <h2>保存した MP3</h2>
      <button class="ghost small" id="openFolder" hidden>フォルダを開く</button>
    </div>
    <p class="empty" id="libEmpty">まだありません。</p>
    <ul id="lib" class="list"></ul>
  </section>

  <section class="card phone" id="phone" hidden>
    <h2>スマホでも使う</h2>
    <div class="phoneBody">
      <div id="qr" class="qr"></div>
      <ol>
        <li>スマホを PC と同じ Wi-Fi につなぐ</li>
        <li>カメラでこの QR コードを読み取る</li>
        <li>開いた画面を「ホーム画面に追加」するとアプリのように使えます</li>
      </ol>
    </div>
    <p class="mono" id="phoneUrl"></p>
  </section>

  <footer class="foot">
    自分で権利を持つ動画、または作者がダウンロードを許可している動画にのみ使ってください。
  </footer>
</main>
<audio id="player" hidden></audio>
<script src="/static/app.js"></script>
</body>
</html>
